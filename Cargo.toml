[package]
name = "byoa-relay"
version = "0.1.0"
edition = "2024"

[lib]
path = "relay/lib.rs"

[[bin]]
name = "byoa-relay"
path = "relay/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.23"
form_urlencoded = "1"
getrandom = "0.4"
http-body-util = "0.1"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
